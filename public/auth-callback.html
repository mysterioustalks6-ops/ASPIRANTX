<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating AspirantX...</title>
  <style>
    body {
      background: #020617;
      color: #38bdf8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px 0; font-size: 20px; color: #f8fafc; }
    p { margin: 0 0 20px 0; font-size: 13px; color: #94a3b8; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }
  </style>
  <script>
    (function() {
      var h = window.location.hash || '';
      var s = window.location.search || '';
      var target = 'com.aspirantx.app://auth' + s + h;

      // Attempt instant redirection into native Android app
      try {
        window.location.replace(target);
      } catch (e) {
        window.location.href = target;
      }

      window.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('open-app-btn');
        if (btn) btn.href = target;
      });
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Returning to AspirantX App...</h2>
  <p>Your authentication is complete. If the app does not open automatically, tap below:</p>
  <a id="open-app-btn" class="btn" href="com.aspirantx.app://auth">Open AspirantX App</a>
</body>
</html>
