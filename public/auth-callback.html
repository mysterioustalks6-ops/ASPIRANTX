<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating StudyRide...</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    body {
      background: #020617;
      color: #38bdf8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px 0; font-size: 20px; color: #f8fafc; }
    p { margin: 0 0 20px 0; font-size: 13px; color: #94a3b8; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 id="status-title">Signing into StudyRide...</h2>
  <p id="status-sub">Please wait, completing your authentication...</p>
  <a id="open-app-btn" class="btn" style="display:none;" href="#">Open StudyRide App</a>

  <script>
    (function() {
      var hash = window.location.hash ? window.location.hash.substring(1) : '';
      var search = window.location.search ? window.location.search.substring(1) : '';
      var rawString = search || hash;
      var params = new URLSearchParams(rawString);

      var idToken = params.get('id_token');
      var accessToken = params.get('access_token');
      var btn = document.getElementById('open-app-btn');
      var title = document.getElementById('status-title');
      var sub = document.getElementById('status-sub');

      function openApp(targetUrl, intentUrl) {
        if (btn) {
          btn.style.display = 'inline-block';
          btn.href = intentUrl || targetUrl;
          btn.onclick = function() {
            window.location.href = intentUrl || targetUrl;
          };
        }
        try {
          if (intentUrl) {
            window.location.href = intentUrl;
          } else {
            window.location.href = targetUrl;
          }
        } catch (e) {
          window.location.href = targetUrl;
        }
      }

      function fallbackDirect() {
        var combined = [search, hash].filter(Boolean).join('&');
        var target = 'com.aspirantx.app://auth' + (combined ? '?' + combined : '');
        var intent = 'intent://auth' + (combined ? '?' + combined : '') + '#Intent;scheme=com.aspirantx.app;package=com.aspirantx.app;end;';
        openApp(target, intent);
      }

      if (idToken || accessToken) {
        // Exchange token with backend server
        fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: idToken, accessToken: accessToken })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data && data.success && data.token) {
            title.innerText = 'Authenticated Successfully!';
            sub.innerText = 'Redirecting back to StudyRide App...';
            var query = 'token=' + encodeURIComponent(data.token) + '&user=' + encodeURIComponent(JSON.stringify(data.user || {}));
            var target = 'com.aspirantx.app://auth?' + query;
            var intent = 'intent://auth?' + query + '#Intent;scheme=com.aspirantx.app;package=com.aspirantx.app;end;';
            openApp(target, intent);
          } else {
            fallbackDirect();
          }
        })
        .catch(function(err) {
          fallbackDirect();
        });
      } else {
        fallbackDirect();
      }
    })();
  </script>
</body>
</html>
