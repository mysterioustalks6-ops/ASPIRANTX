<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <!-- Retro Highway Cruiser 150cc (Friendly Gamified Calm Highway Style) -->
  <defs>
    <!-- Warm Amber Fuel Tank Gradient -->
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <!-- Chrome / Metallic Exhaust Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <!-- Engine Block Gradient -->
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- Saddle Leather Gradient -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="50%" stop-color="#854D0E" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
    <!-- Tire Shadow Filter -->
    <filter id="bikeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <g id="motorcycle" filter="url(#bikeShadow)">
    <!-- Ground / Asphalt Contact Line -->
    <ellipse cx="400" cy="425" rx="350" ry="14" fill="#090E17" opacity="0.8" />

    <!-- ── REAR WHEEL & TIRE ── -->
    <g id="rear-wheel">
      <!-- Outer Rubber Tire -->
      <circle cx="210" cy="325" r="95" stroke="#1E293B" stroke-width="26" fill="none" />
      <!-- Rim Outer Ring -->
      <circle cx="210" cy="325" r="82" stroke="#CBD5E1" stroke-width="6" fill="#090D16" />
      <!-- Brake Disc Rotor -->
      <circle cx="210" cy="325" r="48" stroke="#94A3B8" stroke-width="6" stroke-dasharray="10 6" fill="none" />
      <!-- Spokes -->
      <line x1="210" y1="245" x2="210" y2="405" stroke="#64748B" stroke-width="2.5" />
      <line x1="130" y1="325" x2="290" y2="325" stroke="#64748B" stroke-width="2.5" />
      <line x1="154" y1="269" x2="266" y2="381" stroke="#64748B" stroke-width="2.5" />
      <line x1="154" y1="381" x2="266" y2="269" stroke="#64748B" stroke-width="2.5" />
      <line x1="180" y1="250" x2="240" y2="400" stroke="#475569" stroke-width="2" />
      <line x1="240" y1="250" x2="180" y2="400" stroke="#475569" stroke-width="2" />
      <!-- Wheel Hub -->
      <circle cx="210" cy="325" r="22" fill="#334155" stroke="#E2E8F0" stroke-width="4" />
      <circle cx="210" cy="325" r="8" fill="#F8FAFC" />
    </g>

    <!-- ── FRONT WHEEL & TIRE ── -->
    <g id="front-wheel">
      <!-- Outer Rubber Tire -->
      <circle cx="610" cy="325" r="95" stroke="#1E293B" stroke-width="26" fill="none" />
      <!-- Rim Outer Ring -->
      <circle cx="610" cy="325" r="82" stroke="#CBD5E1" stroke-width="6" fill="#090D16" />
      <!-- Brake Rotor -->
      <circle cx="610" cy="325" r="54" stroke="#94A3B8" stroke-width="7" stroke-dasharray="12 6" fill="none" />
      <circle cx="610" cy="325" r="42" stroke="#64748B" stroke-width="3" fill="none" />
      <!-- Spokes -->
      <line x1="610" y1="245" x2="610" y2="405" stroke="#64748B" stroke-width="2.5" />
      <line x1="530" y1="325" x2="690" y2="325" stroke="#64748B" stroke-width="2.5" />
      <line x1="554" y1="269" x2="666" y2="381" stroke="#64748B" stroke-width="2.5" />
      <line x1="554" y1="381" x2="666" y2="269" stroke="#64748B" stroke-width="2.5" />
      <line x1="580" y1="250" x2="640" y2="400" stroke="#475569" stroke-width="2" />
      <line x1="640" y1="250" x2="580" y2="400" stroke="#475569" stroke-width="2" />
      <!-- Wheel Hub & Brake Caliper -->
      <circle cx="610" cy="325" r="22" fill="#334155" stroke="#E2E8F0" stroke-width="4" />
      <circle cx="610" cy="325" r="8" fill="#F8FAFC" />
      <rect x="588" y="278" width="18" height="32" rx="4" fill="#D97706" stroke="#B45309" stroke-width="2" />
    </g>

    <!-- ── REAR SWINGARM & SUSPENSION SHOCK ── -->
    <path d="M210 325 L365 335 L380 300 Z" fill="#1E293B" stroke="#0F172A" stroke-width="3" />
    <!-- Rear Dual Coilover Spring Shock -->
    <line x1="245" y1="315" x2="305" y2="225" stroke="#64748B" stroke-width="14" stroke-linecap="round" />
    <line x1="245" y1="315" x2="305" y2="225" stroke="#F59E0B" stroke-width="10" stroke-dasharray="6 8" stroke-linecap="round" />
    <circle cx="305" cy="225" r="6" fill="#CBD5E1" />
    <circle cx="245" cy="315" r="6" fill="#CBD5E1" />

    <!-- ── FRONT FORKS & SUSPENSION ── -->
    <!-- Triple Tree & Fork Tubes -->
    <line x1="545" y1="165" x2="610" y2="325" stroke="#94A3B8" stroke-width="14" stroke-linecap="round" />
    <line x1="550" y1="175" x2="605" y2="315" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" />
    <!-- Rubber Fork Gaiters / Dust Boots -->
    <line x1="565" y1="215" x2="585" y2="265" stroke="#0F172A" stroke-width="18" stroke-dasharray="5 4" stroke-linecap="round" />
    <!-- Front Fender / Mudguard -->
    <path d="M545 270 Q585 240 645 260" stroke="#0F766E" stroke-width="12" fill="none" stroke-linecap="round" />

    <!-- ── MAIN CHASSIS FRAME (TUBULAR CR-MO) ── -->
    <path d="M230 240 L340 240 L410 190 L530 180 L440 280 L350 330 Z" fill="none" stroke="#1E293B" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M340 240 L440 330 L520 230" fill="none" stroke="#0F172A" stroke-width="12" stroke-linecap="round" />

    <!-- ── ENGINE BLOCK & COOLING FINS (150cc SINGLE CYLINDER) ── -->
    <!-- Crankcase Shell -->
    <ellipse cx="410" cy="340" rx="46" ry="38" fill="url(#engineGrad)" stroke="#475569" stroke-width="4" />
    <circle cx="410" cy="340" r="24" fill="#1E293B" stroke="#64748B" stroke-width="3" />
    <circle cx="410" cy="340" r="10" fill="#CBD5E1" />
    <!-- Cylinder Barrel & Head (with cooling fins) -->
    <path d="M410 305 L445 240 L400 235 L380 300 Z" fill="url(#engineGrad)" stroke="#334155" stroke-width="3" />
    <!-- Cooling Fins -->
    <line x1="390" y1="250" x2="445" y2="255" stroke="#64748B" stroke-width="3.5" />
    <line x1="388" y1="262" x2="443" y2="267" stroke="#64748B" stroke-width="3.5" />
    <line x1="386" y1="274" x2="440" y2="279" stroke="#64748B" stroke-width="3.5" />
    <line x1="384" y1="286" x2="437" y2="291" stroke="#64748B" stroke-width="3.5" />
    <!-- Spark Plug & Wire -->
    <rect x="420" y="224" width="10" height="12" rx="2" fill="#F8FAFC" />
    <path d="M425 224 Q410 210 390 220" stroke="#EF4444" stroke-width="3" fill="none" />
    <!-- Air Filter Box / Side Cover -->
    <path d="M320 250 L370 250 L380 310 L330 305 Z" fill="#0F766E" stroke="#115E59" stroke-width="3" rx="8" />

    <!-- ── EXHAUST SYSTEM (HEADER PIPE & REAR MUFFLER) ── -->
    <!-- Downpipe from Cylinder Head -->
    <path d="M440 248 C465 260 480 300 470 340 C460 365 420 375 350 375 L210 375 L180 360" 
          fill="none" stroke="url(#chromeGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chrome Megaphone Muffler Silencer -->
    <path d="M330 375 L190 365 L175 350 L190 345 L330 365 Z" fill="url(#chromeGrad)" stroke="#64748B" stroke-width="3" />
    <circle cx="175" cy="350" r="7" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />

    <!-- ── AERODYNAMIC SCULPTED FUEL TANK (WARM AMBER) ── -->
    <path d="M370 245 C370 200 410 170 470 170 C515 170 540 185 545 205 C540 235 480 255 370 245 Z" 
          fill="url(#tankGrad)" stroke="#78350F" stroke-width="4" />
    <!-- Knee Grip Rubber Pad -->
    <path d="M420 230 C430 205 460 200 475 205 C470 225 445 235 420 230 Z" fill="#1E293B" opacity="0.9" />
    <!-- Chrome Fuel Filler Cap -->
    <ellipse cx="485" cy="174" rx="10" ry="4" fill="#F8FAFC" stroke="#64748B" stroke-width="2" />

    <!-- ── TOURING ERGONOMIC SADDLE (LEATHER FINISH) ── -->
    <path d="M250 235 C280 235 340 238 385 240 C380 225 350 215 310 215 C270 215 255 225 250 235 Z" 
          fill="url(#leatherGrad)" stroke="#451A03" stroke-width="4" />
    <!-- Stitching Grooves -->
    <line x1="285" y1="222" x2="288" y2="235" stroke="#78350F" stroke-width="2" />
    <line x1="315" y1="220" x2="318" y2="235" stroke="#78350F" stroke-width="2" />
    <line x1="345" y1="222" x2="348" y2="235" stroke="#78350F" stroke-width="2" />

    <!-- ── REAR FENDER & TAILLIGHT ── -->
    <path d="M170 270 Q210 230 260 235" stroke="#0F766E" stroke-width="12" fill="none" stroke-linecap="round" />
    <!-- Red Taillight -->
    <circle cx="165" cy="275" r="9" fill="#EF4444" stroke="#991B1B" stroke-width="2.5" />
    <circle cx="165" cy="275" r="4" fill="#FCA5A5" />

    <!-- ── HANDLEBARS, CONTROLS & ROUND HEADLIGHT ── -->
    <!-- Handlebar Stem & Bar -->
    <line x1="535" y1="160" x2="520" y2="120" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />
    <line x1="500" y1="125" x2="540" y2="115" stroke="#334155" stroke-width="9" stroke-linecap="round" />
    <!-- Grip & Clutch/Brake Lever -->
    <line x1="500" y1="125" x2="488" y2="125" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
    <line x1="495" y1="130" x2="480" y2="135" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <!-- Chrome Round Rearview Mirror -->
    <line x1="525" y1="118" x2="520" y2="85" stroke="#94A3B8" stroke-width="3.5" />
    <circle cx="520" cy="80" r="10" fill="#E2E8F0" stroke="#475569" stroke-width="2" />
    <circle cx="520" cy="80" r="5" fill="#38BDF8" opacity="0.6" />

    <!-- Classic Round Chrome Headlamp -->
    <g id="headlamp">
      <!-- Chrome Housing Bucket -->
      <path d="M555 185 C565 170 580 170 590 185 L585 205 C575 215 560 215 555 200 Z" fill="#CBD5E1" stroke="#475569" stroke-width="2.5" />
      <!-- Convex Glass Lens with Amber/Warm Glow -->
      <path d="M580 175 Q605 192 580 210 Z" fill="#FEF08A" stroke="#E2E8F0" stroke-width="3" />
      <path d="M582 180 Q595 192 582 205" stroke="#FFFFFF" stroke-width="2" fill="none" />
    </g>

    <!-- Speedometer Gauge Pod -->
    <circle cx="542" cy="150" r="11" fill="#0F172A" stroke="#CBD5E1" stroke-width="3" />
    <circle cx="542" cy="150" r="6" fill="#38BDF8" />
  </g>
</svg>
