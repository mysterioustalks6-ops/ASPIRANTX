<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <!-- Rider Helmet Visor Reflection -->
    <linearGradient id="visorReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Rider Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Armor Accent Orange / Gold -->
    <linearGradient id="armorAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Chrome Exhaust Gradient -->
    <linearGradient id="chromePipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="30%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- LED Taillight Radiant Glow -->
    <radialGradient id="taillightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2056" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0.8" />
    </radialGradient>

    <!-- Asphalt Ground Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#020617" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ── 1. ASPHALT CONTACT GROUND SHADOW ── -->
  <ellipse cx="300" cy="650" rx="200" ry="24" fill="url(#groundShadow)" />
  <ellipse cx="300" cy="646" rx="90" ry="12" fill="#000000" opacity="0.95" />

  <!-- ── 2. REAR MOTORCYCLE WHEEL & TIRE (HEAVY HIGHWAY TREAD) ── -->
  <g id="rearWheel">
    <!-- Massive Cruiser Rear Rubber Tire -->
    <rect x="252" y="470" width="96" height="175" rx="36" fill="#090d16" stroke="#1e293b" stroke-width="4" />
    <!-- Center Tread Groove Pattern -->
    <line x1="300" y1="480" x2="300" y2="640" stroke="#020617" stroke-width="6" stroke-dasharray="14 10" />
    <!-- Left & Right Angled Sipes / Treads -->
    <path d="M268 500 L 290 515 M 268 535 L 290 550 M 268 570 L 290 585 M 268 605 L 290 620" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <path d="M332 500 L 310 515 M 332 535 L 310 550 M 332 570 L 310 585 M 332 605 L 310 620" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <!-- Rear Mudguard / Fender Hugger -->
    <path d="M240 460 Q 300 420 360 460 L 366 525 Q 300 480 234 525 Z" fill="#0f172a" stroke="#334155" stroke-width="3" />
  </g>

  <!-- ── 3. TWIN CHROME EXHAUST PIPES ── -->
  <g id="exhaustPipes">
    <!-- Left Exhaust Pipe -->
    <rect x="210" y="520" width="28" height="95" rx="14" fill="url(#chromePipe)" stroke="#334155" stroke-width="2" />
    <ellipse cx="224" cy="610" rx="11" ry="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="224" cy="610" rx="7" ry="3.5" fill="#f59e0b" opacity="0.6" />

    <!-- Right Exhaust Pipe -->
    <rect x="362" y="520" width="28" height="95" rx="14" fill="url(#chromePipe)" stroke="#334155" stroke-width="2" />
    <ellipse cx="376" cy="610" rx="11" ry="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="376" cy="610" rx="7" ry="3.5" fill="#f59e0b" opacity="0.6" />
  </g>

  <!-- ── 4. CHASSIS, FRAME & SADDLEBAGS ── -->
  <g id="chassis">
    <!-- Left Highway Leather Touring Saddlebag -->
    <rect x="170" y="440" width="60" height="75" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
    <rect x="175" y="450" width="50" height="8" rx="3" fill="url(#armorAccent)" />
    <!-- Right Highway Leather Touring Saddlebag -->
    <rect x="370" y="440" width="60" height="75" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
    <rect x="375" y="450" width="50" height="8" rx="3" fill="url(#armorAccent)" />

    <!-- Center Rear Fender Cowl -->
    <polygon points="230,420 370,420 355,475 245,475" fill="#0f172a" stroke="#475569" stroke-width="2" />

    <!-- LED Laser Strip Taillight -->
    <rect x="250" y="430" width="100" height="14" rx="7" fill="url(#taillightGlow)" filter="drop-shadow(0 0 10px #f43f5e)" />
    <rect x="270" y="433" width="60" height="8" rx="4" fill="#ffffff" opacity="0.9" />

    <!-- Highway License Plate "FOCUS 24" -->
    <rect x="272" y="455" width="56" height="30" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2" />
    <text x="300" y="474" fill="#0f172a" font-size="11" font-family="monospace" font-weight="900" text-anchor="middle">ASPIRE</text>
  </g>

  <!-- ── 5. MOTORCYCLE SADDLE SEAT & FUEL TANK SHOULDERS ── -->
  <g id="saddleAndTank">
    <!-- Wide Ergonomic Highway Saddle -->
    <path d="M230 380 Q 300 355 370 380 L 375 425 Q 300 410 225 425 Z" fill="#0b0f19" stroke="#1e293b" stroke-width="3" />
    <!-- Saddle Stitching Accents -->
    <path d="M245 390 Q 300 375 355 390" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />

    <!-- Cruiser Fuel Tank Visible Shoulders (Flanking the Rider) -->
    <ellipse cx="205" cy="345" rx="30" ry="40" fill="#d97706" stroke="#f59e0b" stroke-width="3" />
    <ellipse cx="395" cy="345" rx="30" ry="40" fill="#d97706" stroke="#f59e0b" stroke-width="3" />
  </g>

  <!-- ── 6. RIDER BODY, LEGS & LEATHER TOURING JACKET ── -->
  <g id="riderBody">
    <!-- Left Leg & Riding Boot (Tucked at Highway Peg) -->
    <path d="M210 390 Q 185 450 190 510 L 220 510 Q 215 450 235 395 Z" fill="#090d16" stroke="#1e293b" stroke-width="2" />
    <polygon points="185,505 220,505 215,530 180,530" fill="#020617" stroke="#334155" stroke-width="2" />

    <!-- Right Leg & Riding Boot -->
    <path d="M390 390 Q 415 450 410 510 L 380 510 Q 385 450 365 395 Z" fill="#090d16" stroke="#1e293b" stroke-width="2" />
    <polygon points="380,505 415,505 420,530 385,530" fill="#020617" stroke="#334155" stroke-width="2" />

    <!-- Muscular Torso & Spine (Focused Aerodynamic Forward Lean) -->
    <path d="M220 220 Q 300 205 380 220 L 365 375 Q 300 365 235 375 Z" fill="url(#jacketGrad)" stroke="#334155" stroke-width="3" />

    <!-- Spine Protector Armor Plate -->
    <polygon points="280,240 320,240 315,350 285,350" fill="#020617" stroke="#1e293b" stroke-width="2" />
    <line x1="285" y1="265" x2="315" y2="265" stroke="url(#armorAccent)" stroke-width="2.5" />
    <line x1="287" y1="295" x2="313" y2="295" stroke="url(#armorAccent)" stroke-width="2.5" />
    <line x1="289" y1="325" x2="311" y2="325" stroke="url(#armorAccent)" stroke-width="2.5" />

    <!-- Left Shoulder & Arm Reaching Forward to Grip -->
    <path d="M225 220 Q 160 250 145 295 L 175 315 Q 195 275 245 255 Z" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
    <!-- Left Gauntlet Glove -->
    <ellipse cx="140" cy="295" rx="16" ry="14" fill="#020617" stroke="#f59e0b" stroke-width="2" />

    <!-- Right Shoulder & Arm Reaching Forward to Grip -->
    <path d="M375 220 Q 440 250 455 295 L 425 315 Q 405 275 355 255 Z" fill="#1e293b" stroke="#334155" stroke-width="2.5" />
    <!-- Right Gauntlet Glove -->
    <ellipse cx="460" cy="295" rx="16" ry="14" fill="#020617" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- ── 7. WIDE HANDLEBARS & REARVIEW MIRRORS ── -->
  <g id="handlebars">
    <line x1="130" y1="295" x2="470" y2="295" stroke="url(#chromePipe)" stroke-width="8" stroke-linecap="round" />
    <!-- Bar End Weights -->
    <circle cx="122" cy="295" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="478" cy="295" r="9" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <!-- Left Teardrop Mirror -->
    <ellipse cx="115" cy="255" rx="18" ry="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="115" cy="255" rx="14" ry="8" fill="#38bdf8" opacity="0.4" />
    <line x1="125" y1="290" x2="115" y2="267" stroke="#94a3b8" stroke-width="4" />
    <!-- Right Teardrop Mirror -->
    <ellipse cx="485" cy="255" rx="18" ry="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="485" cy="255" rx="14" ry="8" fill="#38bdf8" opacity="0.4" />
    <line x1="475" y1="290" x2="485" y2="267" stroke="#94a3b8" stroke-width="4" />
  </g>

  <!-- ── 8. RIDER HELMET (AERODYNAMIC SPORT TOURING HELMET) ── -->
  <g id="helmet">
    <!-- Helmet Outer Shell (Gloss Obsidian with Amber Decals) -->
    <path d="M250 160 C 250 95, 350 95, 350 160 C 350 195, 340 215, 300 218 C 260 215, 250 195, 250 160 Z" fill="#090d16" stroke="#334155" stroke-width="3.5" />

    <!-- Helmet Top Aero Spoiler Fins -->
    <polygon points="280,105 320,105 315,120 285,120" fill="#f59e0b" />
    <line x1="300" y1="102" x2="300" y2="122" stroke="#000000" stroke-width="2" />

    <!-- Reflective Twilight Chrome Visor Edge (Rear Quarter Glimpse) -->
    <path d="M260 150 Q 300 135 340 150 Q 345 175 330 180 Q 300 165 270 180 Z" fill="url(#visorReflection)" filter="drop-shadow(0 0 6px #38bdf8)" opacity="0.85" />

    <!-- Helmet Chin Guard & Collar Base -->
    <rect x="278" y="212" width="44" height="14" rx="4" fill="#020617" stroke="#475569" stroke-width="1.5" />
    <!-- Reflective Neck Hi-Viz Strip -->
    <line x1="265" y1="218" x2="335" y2="218" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
